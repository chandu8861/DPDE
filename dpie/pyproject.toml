[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dpie"
version = "0.1.0"
description = "DarkPattern Intelligence Engine - Multi-Agent AI Framework"
readme = "SUMMARY.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
dashboard = [
    "jinja2>=3.1.0",
]

[project.scripts]
dpie = "dpie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dpie*"]
